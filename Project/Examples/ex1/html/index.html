<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Index Page</title>

  <!-- Optional CSS -->
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    header {
      background: #333;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    button {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome!</h1>
    <p>This is a sample index.html page</p>
  </header>

  <main>
    <h2>Hello World 👋</h2>
    <p>Edit this file to start building your website.</p>

    <button onclick="sayHello()">Click me</button>
  </main>

  <!-- Optional JavaScript -->
  <script>
    function sayHello() {
      alert("Hello from index.html!");
    }
  </script>

</body>
</html>
