services:
  nginx:
    image: nginx:alpine
    container_name: hc-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build: ./app
    container_name: hc-app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: hc-redis
    volumes:
      - redis_data:/data

volumes:
  redis_data:
